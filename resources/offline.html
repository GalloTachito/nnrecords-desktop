<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NN Records - Sin Conexión</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #13131b;
      color: #e4e1ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    .card {
      background: #1f1f27;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(192, 164, 221, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #c0a4dd;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      stroke-width: 2;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #958ea0;
      margin-bottom: 28px;
    }
    .btn {
      background: #c0a4dd;
      color: #13131b;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.828m2.829 2.828L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.828m-4.243 4.243a9 9 0 01-5.657-2.828m0 0l2.829-2.828m-2.829 2.828L3 21m3.464-12.536a5 5 0 015.657-1.414M3 3l18 18" />
      </svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>No se ha podido conectar con los servidores de NN Records. Comprueba tu conexión a la red e inténtalo de nuevo.</p>
    <button class="btn" onclick="window.location.href='https://nnrecords.app'">Reintentar conexión</button>
  </div>
</body>
</html>
