[package]
name = "nn-records"
version = "1.0.0"
description = "NN Records - Música libre de copyright"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.41"

[profile.release]
strip = true
lto = true
codegen-units = 1
