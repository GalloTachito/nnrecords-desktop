name: Compilar y Publicar App de Escritorio (Windows + macOS)

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin     # Mac Apple Silicon (M1/M2/M3/M4)
          - platform: macos-latest
            target: x86_64-apple-darwin      # Mac Intel
          - platform: windows-latest
            target: ""                       # Windows (.exe NSIS x64)

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar Rust y Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de dependencias de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar el CLI de Tauri v2
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Compilar instalador (macOS)
        if: matrix.target != ''
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Compilar instalador (Windows)
        if: matrix.target == ''
        run: cargo tauri build

      - name: Subir artefacto temporal (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: nn-records-${{ matrix.platform }}-${{ matrix.target || 'windows' }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Publicar en GitHub Releases (al empujar tag v*)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
